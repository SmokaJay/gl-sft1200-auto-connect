global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - allora_alerts.yml

scrape_configs:
  - job_name: hailo-inference
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: /metrics

  - job_name: allora-exporter
    static_configs:
      - targets: ['localhost:8001']
