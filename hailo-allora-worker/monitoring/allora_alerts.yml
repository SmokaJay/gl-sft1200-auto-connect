groups:
  - name: allora_worker
    interval: 60s
    rules:
      - alert: HighInferenceLatency
        expr: histogram_quantile(0.99, rate(inference_latency_ms_bucket[5m])) > 150
        for: 5m
        annotations:
          summary: "Inference p99 latency > 150ms — check Pi thermals or Hailo connection"

      - alert: LowSubmissionRate
        expr: rate(submissions_total[10m]) == 0
        for: 10m
        annotations:
          summary: "No submissions in 10 minutes — worker node may be down"

      - alert: ReputationDropping
        expr: delta(reputation_score[1h]) < -0.1
        for: 1h
        annotations:
          summary: "Reputation dropped >10% in 1h — model accuracy may have degraded"

      - alert: HailoInferenceErrors
        expr: rate(inference_total{error="true"}[5m]) > 0.1
        for: 5m
        annotations:
          summary: "Inference error rate >10% — check Hailo device"
