# /etc/auto-connect.conf
# Configuration for the auto-connect WiFi daemon.
# Shell variable syntax — sourced directly by auto-connect.sh.
# After editing, restart with: /etc/init.d/auto-connect restart

# ── Radio & Interface ────────────────────────────────────────────────
# radio0 is typically the 2.4 GHz radio on GL-SFT1200
# Use "radio1" for 5 GHz if your unit has dual-band and you prefer 5 GHz
RADIO="radio0"

# UCI network interface name for the WAN station connection
WAN_IFACE="wwan"

# Physical wifi interface used for scanning
# Run "iwinfo" on the router to confirm; usually wlan0 or wlan1
SCAN_IFACE="wlan0"

# ── Internet Check ───────────────────────────────────────────────────
# Host to ping to verify internet connectivity
CHECK_HOST="1.1.1.1"

# Seconds to wait for ping response
CHECK_TIMEOUT=5

# ── Timing ──────────────────────────────────────────────────────────
# Seconds to wait for DHCP after associating with a network
CONNECT_WAIT=20

# Seconds between connectivity checks when already connected
SCAN_INTERVAL=30

# Seconds between scan attempts when no network is found
FAIL_SCAN_INTERVAL=15

# ── Network Quality ──────────────────────────────────────────────────
# Networks with signal weaker than this (in dBm) will be skipped.
# -80 is a reasonable minimum; set to -90 to accept very weak networks.
MIN_SIGNAL=-80

# ── Blacklisting ────────────────────────────────────────────────────
# How long (seconds) to avoid a network that had no internet
# 300 = 5 minutes
BLACKLIST_TTL=300
